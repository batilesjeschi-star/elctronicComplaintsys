# For testing the production Docker image LOCALLY before you deploy it.
# Run:  docker compose up --build
# Then visit http://localhost:8000
version: "3.8"
services:
  app:
    build: .
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ecs_db
      DB_USERNAME: ecs_user
      DB_PASSWORD: secret
      FILESYSTEM_DISK: public
      MAIL_MAILER: log
    depends_on:
      - db
    volumes:
      - storage_data:/var/www/html/storage/app/public

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ecs_db
      MYSQL_USER: ecs_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
  storage_data:
